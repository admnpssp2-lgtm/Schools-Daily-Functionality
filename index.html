<script>


/* =====================================================
   APPS SCRIPT WEB APP URL
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwxsV6ZkY2usbNs1Q9gqkxaJivNGgdkzLJNIW4Nynq3XXa1XwgF3P6CU4fCqnT6rN0SuQ/exec";


/* =====================================================
   DATABASE
===================================================== */

const DB_NAME =
  "SchoolsDailyFunctionalityDB";

let db;


/* =====================================================
   GPS VARIABLES
===================================================== */

let currentLatitude = "";

let currentLongitude = "";

let currentAccuracy = "";

let gpsWatchId = null;

let gpsRetryTimer = null;


/* =====================================================
   OPEN DATABASE
===================================================== */

function openDB() {

  return new Promise(
    function(resolve, reject) {

      const request =
        indexedDB.open(
          DB_NAME,
          1
        );


      request.onupgradeneeded =
        function(event) {

          const database =
            event.target.result;


          if (
            !database.objectStoreNames
              .contains("master")
          ) {

            database.createObjectStore(
              "master",
              {
                keyPath: "id"
              }
            );

          }


          if (
            !database.objectStoreNames
              .contains("drafts")
          ) {

            database.createObjectStore(
              "drafts",
              {
                keyPath:
                  "submissionId"
              }
            );

          }

        };


      request.onsuccess =
        function(event) {

          db =
            event.target.result;

          resolve();

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/* =====================================================
   DB PUT
===================================================== */

function dbPut(
  storeName,
  data
) {

  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          storeName,
          "readwrite"
        );

      const store =
        transaction.objectStore(
          storeName
        );

      store.put(data);

      transaction.oncomplete =
        function() {

          resolve();

        };

      transaction.onerror =
        function() {

          reject(
            transaction.error
          );

        };

    }
  );

}


/* =====================================================
   DB GET ALL
===================================================== */

function dbGetAll(
  storeName
) {

  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          storeName,
          "readonly"
        );

      const store =
        transaction.objectStore(
          storeName
        );

      const request =
        store.getAll();

      request.onsuccess =
        function() {

          resolve(
            request.result
          );

        };

      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/* =====================================================
   DB DELETE
===================================================== */

function dbDelete(
  storeName,
  key
) {

  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          storeName,
          "readwrite"
        );

      const store =
        transaction.objectStore(
          storeName
        );

      store.delete(key);

      transaction.oncomplete =
        function() {

          resolve();

        };

      transaction.onerror =
        function() {

          reject(
            transaction.error
          );

        };

    }
  );

}


/* =====================================================
   API REQUEST
===================================================== */

async function apiRequest(
  action,
  payload = {}
) {

  const response =
    await fetch(
      API_URL,
      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify({

            action:
              action,

            payload:
              payload

          })

      }
    );


  if (!response.ok) {

    throw new Error(
      "Server connection failed."
    );

  }


  const result =
    await response.json();


  if (!result.success) {

    throw new Error(
      result.message ||
      "Server error."
    );

  }


  return result.data;

}


/* =====================================================
   LOAD MASTER DATA
===================================================== */

async function loadMasterData() {

  let master =
    await dbGetAll(
      "master"
    );


  if (
    navigator.onLine
  ) {

    try {

      const data =
        await apiRequest(
          "getSchoolMasterData"
        );


      for (
        const item of data
      ) {

        await dbPut(
          "master",
          {

            id:
              item.cluster +
              "|" +
              item.school,

            cluster:
              item.cluster,

            school:
              item.school,

            emis:
              item.emis

          }
        );

      }


      master =
        await dbGetAll(
          "master"
        );

    }

    catch(error) {

      console.log(
        "Could not refresh master data:",
        error
      );

    }

  }


  populateClusters(
    master
  );

}


/* =====================================================
   POPULATE CLUSTERS
===================================================== */

function populateClusters(
  master
) {

  const clusterSelect =
    document.getElementById(
      "cluster"
    );


  const clusters =
    [
      ...new Set(
        master.map(
          function(item) {

            return item.cluster;

          }
        )
      )
    ];


  clusters.sort();


  clusterSelect.innerHTML =
    '<option value="">Select Cluster</option>';


  clusters.forEach(
    function(cluster) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        cluster;


      option.textContent =
        cluster;


      clusterSelect.appendChild(
        option
      );

    }
  );

}


/* =====================================================
   CLUSTER CHANGE
===================================================== */

document
  .getElementById("cluster")
  .addEventListener(
    "change",
    async function() {

      const cluster =
        this.value;


      const schoolSelect =
        document.getElementById(
          "school"
        );


      const emis =
        document.getElementById(
          "emis"
        );


      schoolSelect.innerHTML =
        '<option value="">Select School</option>';


      emis.value =
        "";


      schoolSelect.disabled =
        true;


      if (!cluster) {

        return;

      }


      const master =
        await dbGetAll(
          "master"
        );


      const schools =
        master.filter(
          function(item) {

            return String(
              item.cluster
            ) === String(
              cluster
            );

          }
        );


      schools.sort(
        function(a, b) {

          return String(
            a.school
          ).localeCompare(
            String(b.school)
          );

        }
      );


      schools.forEach(
        function(item) {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            item.school;


          option.textContent =
            item.school;


          option.dataset.emis =
            item.emis;


          schoolSelect.appendChild(
            option
          );

        }
      );


      schoolSelect.disabled =
        false;

    }
  );


/* =====================================================
   SCHOOL CHANGE
===================================================== */

document
  .getElementById("school")
  .addEventListener(
    "change",
    function() {

      const selected =
        this.options[
          this.selectedIndex
        ];


      document.getElementById(
        "emis"
      ).value =
        selected.dataset.emis ||
        "";

    }
  );


/* =====================================================
   GPS UI
===================================================== */

function setGPSStatus(
  message,
  type
) {

  const box =
    document.getElementById(
      "gpsBox"
    );

  const status =
    document.getElementById(
      "gpsStatus"
    );


  box.className =
    "gps " +
    type;


  status.innerHTML =
    message;

}


/* =====================================================
   CAPTURE GPS
===================================================== */

function captureGPS() {

  return new Promise(
    function(resolve, reject) {

      if (
        !navigator.geolocation
      ) {

        setGPSStatus(
          "GPS is not supported by this device/browser.",
          "gps-error"
        );

        reject(
          new Error(
            "GPS is not supported by this device/browser."
          )
        );

        return;

      }


      setGPSStatus(
        "Getting precise GPS location...<br>Please wait.",
        "gps-loading"
      );


      let finished =
        false;


      function success(position) {

        if (finished) {
          return;
        }


        finished = true;


        currentLatitude =
          position.coords.latitude;


        currentLongitude =
          position.coords.longitude;


        currentAccuracy =
          position.coords.accuracy;


        const accuracy =
          Number(
            currentAccuracy
          ).toFixed(1);


        setGPSStatus(

          "🟢 Location Captured<br>" +

          "LAT: " +
          currentLatitude +
          "<br>" +

          "LONG: " +
          currentLongitude +
          "<br>" +

          "Accuracy: " +
          accuracy +
          " meters",

          "gps-success"

        );


        resolve({

          latitude:
            currentLatitude,

          longitude:
            currentLongitude,

          accuracy:
            currentAccuracy

        });

      }


      function failure(error) {

        if (finished) {
          return;
        }


        finished = true;


        let message =
          "GPS location could not be captured.";


        if (
          error.code ===
          error.PERMISSION_DENIED
        ) {

          message =
            "Location permission was denied.<br>" +
            "Please allow Location permission for this website/app.";

        }

        else if (
          error.code ===
          error.POSITION_UNAVAILABLE
        ) {

          message =
            "Location is currently unavailable.<br>" +
            "Please turn ON phone Location/GPS and try again.";

        }

        else if (
          error.code ===
          error.TIMEOUT
        ) {

          message =
            "GPS request timed out.<br>" +
            "Please move to an open area and try again.";

        }


        setGPSStatus(
          "🔴 " + message,
          "gps-error"
        );


        reject(
          new Error(
            "GPS location could not be captured. " +
            "Please make sure phone Location/GPS is ON and browser permission is allowed."
          )
        );

      }


      navigator.geolocation.getCurrentPosition(
        success,
        failure,
        {

          enableHighAccuracy:
            true,

          timeout:
            45000,

          maximumAge:
            0

        }
      );

    }
  );

}


/* =====================================================
   START GPS MONITORING
===================================================== */

function startGPSMonitoring() {

  if (
    !navigator.geolocation
  ) {

    setGPSStatus(
      "GPS is not supported.",
      "gps-error"
    );

    return;

  }


  captureGPS()
    .catch(
      function(error) {

        console.log(
          "Initial GPS:",
          error
        );

      }
    );


  if (
    gpsWatchId !== null
  ) {

    navigator.geolocation.clearWatch(
      gpsWatchId
    );

  }


  gpsWatchId =
    navigator.geolocation.watchPosition(

      function(position) {

        currentLatitude =
          position.coords.latitude;


        currentLongitude =
          position.coords.longitude;


        currentAccuracy =
          position.coords.accuracy;


        const accuracy =
          Number(
            currentAccuracy
          ).toFixed(1);


        setGPSStatus(

          "🟢 Location Captured<br>" +

          "LAT: " +
          currentLatitude +
          "<br>" +

          "LONG: " +
          currentLongitude +
          "<br>" +

          "Accuracy: " +
          accuracy +
          " meters",

          "gps-success"

        );

      },

      function(error) {

        console.log(
          "GPS watch error:",
          error
        );

      },

      {

        enableHighAccuracy:
          true,

        timeout:
          45000,

        maximumAge:
          10000

      }

    );

}


/* =====================================================
   STAMP PHOTO
===================================================== */

function stampPhoto(
  file,
  latitude,
  longitude,
  accuracy
) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          const img =
            new Image();


          img.onload =
            function() {

              const canvas =
                document.createElement(
                  "canvas"
                );


              let width =
                img.width;

              let height =
                img.height;


              const maxWidth =
                1600;


              if (
                width >
                maxWidth
              ) {

                height =
                  height *
                  (
                    maxWidth /
                    width
                  );

                width =
                  maxWidth;

              }


              canvas.width =
                width;


              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              const now =
                new Date();


              const date =
                now.toLocaleDateString();


              const time =
                now.toLocaleTimeString();


              const boxHeight =
                145;


              ctx.fillStyle =
                "rgba(0,0,0,0.72)";


              ctx.fillRect(
                0,
                height -
                  boxHeight,
                width,
                boxHeight
              );


              ctx.fillStyle =
                "#ffffff";


              ctx.font =
                "bold 28px Arial";


              ctx.fillText(
                "DATE: " +
                date,
                20,
                height -
                  105
              );


              ctx.fillText(
                "TIME: " +
                time,
                20,
                height -
                  70
              );


              ctx.font =
                "22px Arial";


              ctx.fillText(
                "LAT: " +
                latitude,
                20,
                height -
                  38
              );


              ctx.fillText(
                "LONG: " +
                longitude +
                "  ACC: " +
                Number(
                  accuracy
                ).toFixed(1) +
                "m",
                20,
                height -
                  10
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  0.85
                )
              );

            };


          img.onerror =
            function() {

              reject(
                new Error(
                  "Image processing failed."
                )
              );

            };


          img.src =
            event.target.result;

        };


      reader.onerror =
        function() {

          reject(
            new Error(
              "Could not read photo."
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =====================================================
   PHOTO PREVIEW

function setupPreview(
  inputId,
  previewId
) {

  document
    .getElementById(inputId)
    .addEventListener(
      "change",
      function() {

        const file =
          this.files[0];


        if (!file) {
          return;
        }


        const preview =
          document.getElementById(
            previewId
          );


        preview.src =
          URL.createObjectURL(
            file
          );


        preview.style.display =
          "block";

      }
    );

}

/* =====================================================
   CREATE SUBMISSION
===================================================== */

async function createSubmission() {

  const cluster =
    document.getElementById(
      "cluster"
    ).value;


  const school =
    document.getElementById(
      "school"
    ).value;


  const emis =
    document.getElementById(
      "emis"
    ).value;


  const staffFile =
    document.getElementById(
      "staffPhoto"
    ).files[0];


  const assemblyFile =
    document.getElementById(
      "assemblyPhoto"
    ).files[0];


  if (!cluster) {

    throw new Error(
      "Please select Cluster."
    );

  }


  if (!school) {

    throw new Error(
      "Please select School."
    );

  }


  if (!emis) {

    throw new Error(
      "EMIS Code is missing."
    );

  }


  if (!staffFile) {

    throw new Error(
      "Please capture Staff photo."
    );

  }


  if (!assemblyFile) {

    throw new Error(
      "Please capture Students photo."
    );

  }


  /* ===================================================
     FRESH GPS BEFORE SUBMISSION
  =================================================== */

  let gps;


  try {

    gps =
      await captureGPS();

  }

  catch(error) {

    throw new Error(
      "Submission stopped.\n\n" +
      "Fresh GPS location could not be captured.\n" +
      "Please turn ON Location/GPS and allow location permission, then try again."
    );

  }


  const capturedAt =
    new Date().toISOString();


  const staffPhoto =
    await stampPhoto(
      staffFile,
      gps.latitude,
      gps.longitude,
      gps.accuracy
    );


  const assemblyPhoto =
    await stampPhoto(
      assemblyFile,
      gps.latitude,
      gps.longitude,
      gps.accuracy
    );


  return {

    submissionId:

      "SUB-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2, 9),


    capturedAt:
      capturedAt,


    cluster:
      cluster,


    school:
      school,


    emis:
      emis,


    latitude:
      gps.latitude,


    longitude:
      gps.longitude,


    accuracy:
      gps.accuracy,


    staffPhoto:
      staffPhoto,


    assemblyPhoto:
      assemblyPhoto

  };

}


/* =====================================================

async function submitForm() {

  const button =
    document.getElementById(
      "submitBtn"
    );


  try {

    button.disabled =
      true;


    button.textContent =
      "Getting GPS...";


    const submission =
      await createSubmission();


    button.textContent =
      "Submitting...";


    if (
      navigator.onLine
    ) {

      try {

        await apiRequest(
          "saveMonitoring",
          submission
        );


        alert(
          "Submitted Successfully."
        );


        clearForm();

      }

      catch(error) {

        await dbPut(
          "drafts",
          submission
        );


        alert(
          "Server connection failed.\n\n" +
          "Your submission has been saved offline and will sync automatically."
        );

      }

    }

    else {

      await dbPut(
        "drafts",
        submission
      );


      alert(
        "You are offline.\n\n" +
        "Your submission has been saved on this device."
      );

    }


    await updatePendingCount();

  }

  catch(error) {

    alert(
      error.message
    );

  }

  finally {

    button.disabled =
      false;


    button.textContent =
      "Submit";

  }

}


/* =====================================================
   SAVE DRAFT
===================================================== */

async function saveDraft() {

  try {

    const submission =
      await createSubmission();


    await dbPut(
      "drafts",
      submission
    );


    alert(
      "Draft saved successfully."
    );


    await updatePendingCount();

  }

  catch(error) {

    alert(
      error.message
    );

  }

}


/* =====================================================
   SYNC PENDING
===================================================== */

async function syncDrafts() {

  if (
    !navigator.onLine
  ) {

    alert(
      "Internet connection is not available."
    );

    return;

  }


  const drafts =
    await dbGetAll(
      "drafts"
    );


  if (
    drafts.length === 0
  ) {

    alert(
      "No pending uploads."
    );

    return;

  }


  let successCount =
    0;


  for (
    const draft of drafts
  ) {

    try {

      await apiRequest(
        "saveMonitoring",
        draft
      );


      await dbDelete(
        "drafts",
        draft.submissionId
      );


      successCount++;

    }

    catch(error) {

      console.log(
        "Sync failed:",
        error
      );

    }

  }


  await updatePendingCount();


  alert(
    successCount +
    " submission(s) synced successfully."
  );

}


/* =====================================================
   PENDING COUNT
===================================================== */

async function updatePendingCount() {

  const drafts =
    await dbGetAll(
      "drafts"
    );


  document.getElementById(
    "pendingCount"
  ).textContent =
    "Pending Uploads: " +
    drafts.length;

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm() {

  document.getElementById(
    "cluster"
  ).value =
    "";


  document.getElementById(
    "school"
  ).innerHTML =
    '<option value="">Select School</option>';


  document.getElementById(
    "school"
  ).disabled =
    true;


  document.getElementById(
    "emis"
  ).value =
    "";


  document.getElementById(
    "staffPhoto"
  ).value =
    "";


  document.getElementById(
    "assemblyPhoto"
  ).value =
    "";


  document.getElementById(
    "staffPreview"
  ).style.display =
    "none";


  document.getElementById(
    "assemblyPreview"
  ).style.display =
    "none";


  /* Keep GPS active after form reset */

  if (
    currentLatitude &&
    currentLongitude
  ) {

    setGPSStatus(

      "🟢 Location Captured<br>" +

      "LAT: " +
      currentLatitude +
      "<br>" +

      "LONG: " +
      currentLongitude +
      "<br>" +

      "Accuracy: " +
      Number(
        currentAccuracy
      ).toFixed(1) +
      " meters",

      "gps-success"

    );

  }

}


/* =====================================================
   NETWORK STATUS
===================================================== */

function updateNetworkStatus() {

  const element =
    document.getElementById(
      "networkStatus"
    );


  if (
    navigator.onLine
  ) {

    element.textContent =
      "🟢 Online";


    element.className =
      "status online";

  }

  else {

    element.textContent =
      "🔴 Offline - Data will be saved on this device";


    element.className =
      "status offline";

  }

}


window.addEventListener(
  "online",
  async function() {

    updateNetworkStatus();


    await syncDrafts();


    await loadMasterData();


    startGPSMonitoring();

  }
);


window.addEventListener(
  "offline",
  function() {

    updateNetworkStatus();

  }
);


/* =====================================================
   PWA INSTALL
===================================================== */

let deferredInstallPrompt =
  null;


window.addEventListener(
  "beforeinstallprompt",
  function(event) {

    event.preventDefault();


    deferredInstallPrompt =
      event;


    document.getElementById(
      "installBtn"
    ).style.display =
      "block";

  }
);


document
  .getElementById("installBtn")
  .addEventListener(
    "click",
    async function() {

      if (
        !deferredInstallPrompt
      ) {

        return;

      }


      deferredInstallPrompt.prompt();


      await deferredInstallPrompt
        .userChoice;


      deferredInstallPrompt =
        null;


      this.style.display =
        "none";

    }
  );


/* =====================================================
   SERVICE WORKER
===================================================== */

if (
  "serviceWorker" in navigator
) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register(
          "service-worker.js"
        )
        .then(
          function() {

            console.log(
              "Service Worker registered."
            );

          }
        )
        .catch(
          function(error) {

            console.log(
              "Service Worker error:",
              error
            );

          }
        );

    }
  );

}


/* =====================================================
   START APP
===================================================== */

async function startApp() {

  try {

    await openDB();


    updateNetworkStatus();


    await loadMasterData();


    /* Start improved GPS system */

    startGPSMonitoring();


    await updatePendingCount();

  }

  catch(error) {

    console.log(
      "App startup error:",
      error
    );

  }

}


startApp();


</script>
